# Team members, shown in the Team section by layouts/shortcodes/team.html.
# Source: https://hanielbarbosa.com/#team (last synced 2026-11-06).
#
# Fields (all optional except name):
#   name, role, url (personal page, opened when clicking the photo),
#   image (path under static/; falls back to img/team/default.jpg if the file is missing),
#   since / until (shown for past members), description (not displayed for now),
#   bibtex (DBLP publication list: https://dblp.org/pid/<dblp id>.bib).

# Group photo shown at the top of the Team section (remove this block to hide it).
group_photo:
  image: img/team/team_2026.jpg
  caption: The SMITE team in 2026.

# Groups of the "Current members" list, in this order, each with its subheading.
# A member goes in the group that lists their role; members whose role is in no group are
# shown at the end under "Other members".
groups:
  - title: Professor
    roles: [Tenured Assistant Professor]
  - title: Post-docs and PhD students
    roles: [Post-doctoral scholar, PhD student]
  - title: MSc students
    roles: [MSc student]
  - title: Research engineers
    roles: [Research Engineer]
  - title: Undergraduate researchers
    roles: [Undergraduate researcher]

