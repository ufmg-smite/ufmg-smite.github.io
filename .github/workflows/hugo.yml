name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main  # run when you push to main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.146.0'  # must match your local Hugo

      - name: Generate publications data from bib/publications.bib
        run: python3 scripts/bib2json.py

      - name: Refuse slides larger than 2 MB
        run: |
          too_big=$(find static/slides -type f -size +2097152c 2>/dev/null)
          if [ -n "$too_big" ]; then
            echo "::error::Slides must be at most 2 MB:"
            ls -lh $too_big
            exit 1
          fi

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
